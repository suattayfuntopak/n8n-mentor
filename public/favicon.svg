<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark background with rounded corners -->
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <!-- Left node -->
  <circle cx="18" cy="50" r="10" stroke="#ff4d6d" stroke-width="9" fill="none"/>
  <!-- Middle node -->
  <circle cx="50" cy="50" r="10" stroke="#ff4d6d" stroke-width="9" fill="none"/>
  <!-- Top-right node -->
  <circle cx="82" cy="24" r="10" stroke="#ff4d6d" stroke-width="9" fill="none"/>
  <!-- Bottom-right node -->
  <circle cx="82" cy="76" r="10" stroke="#ff4d6d" stroke-width="9" fill="none"/>
  <!-- Connector: left to middle -->
  <line x1="28" y1="50" x2="40" y2="50" stroke="#ff4d6d" stroke-width="9" stroke-linecap="round"/>
  <!-- Connector: middle to top-right -->
  <line x1="59" y1="44" x2="73" y2="30" stroke="#ff4d6d" stroke-width="9" stroke-linecap="round"/>
  <!-- Connector: middle to bottom-right -->
  <line x1="59" y1="56" x2="73" y2="70" stroke="#ff4d6d" stroke-width="9" stroke-linecap="round"/>
</svg>
